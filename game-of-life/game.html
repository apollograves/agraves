<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game of Life — Apollo Graves</title>
    <meta name="theme-color" content="#101418">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235097ca'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='600' text-anchor='middle' fill='%23101418'>A</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=11">
</head>
<body>
    <div class="headerFlex">
        <a class="btn btn--ghost" href="../index.html">← Home</a>
        <h1>Game of Life</h1>
        <div></div>
    </div>
    <div class="centeredFlex">
        <button onclick="startSimulation()">Start</button>
        <button onclick="stopSimulation()">Stop</button>
        <button onclick="resetGrid()">Reset</button>
        <label for="speed">Simulation Speed (ms):</label>
        <input id="speed" type="range" min="50" max="1000" step="50"
               oninput="setSimulationSpeed(this.value)">
        <span id="speedValue"></span>
    </div>
    <br>
    <div class="centeredFlex">
        <canvas id="gameOfLife" width="720" height="720" class="canvas"></canvas>
    </div>
    <script src="game.js?v=2"></script>
</body>
</html>
