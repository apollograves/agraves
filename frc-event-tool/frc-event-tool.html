<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRC Event Tool — Apollo Graves</title>
  <meta name="theme-color" content="#101418">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235097ca'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='600' text-anchor='middle' fill='%23101418'>A</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=11">
</head>
<body>
  <div class="headerFlex">
    <a class="btn btn--ghost" href="../index.html">← Home</a>
    <h1>FRC Event Tool</h1>
    <div></div>
  </div>
  <div class="horizontalFlex">
    <label for="Team Number">Team Number: </label><input type="number" id="Team Number">
    <div id="teamNumberLoader" class="loader"></div>
  </div>
  <div class="horizontalFlex">
    <label id="Next Event">Next Event: </label>
  </div>
  <div class="tableWrap">
  <table id="dataTable" class="eventTable">
    <thead>
      <tr>
        <th id="nameHeader" onclick="sortTeamData('name')" style="width:200px">Name</th>
        <th id="numberHeader" onclick="sortTeamData('number')" style="width:60px">Number</th>
        <th id="epaHeader" onclick="sortTeamData('EPA')" style="width:60px">EPA</th>
        <th id="rankHeader" onclick="sortTeamData('rank')" style="width:30px">Rank</th>
        <th id="winLossHeader" onclick="sortTeamData('winLoss')" style="width:100px">Win/Loss</th>
        <th id="rpAvgHeader" onclick="sortTeamData('rpAvg')" style="width:50px">RP Avg</th>
        <th id="coopAvgHeader" onclick="sortTeamData('coopAvg')" style="width:50px">Coop Avg</th>
        <th id="matchAvgHeader" onclick="sortTeamData('matchAvg')" style="width:50px">Match Avg</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  <div class="tableWrap">
  <table id="matchTable" class="eventTable">
    <thead>
    <tr>
      <th id="matchNumber" style="width:50px">Match</th>
      <th id="matchTime" style="width:100px">Time</th>
      <th id="redAlliance" style="width:120px">Red Alliance</th>
      <th id="blueAlliance" style="width:120px">Blue Alliance</th>
      <th id="winPercentage" style="width:50px">Win %</th>
    </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  <script src="frc-event-tool.js?v=4"></script>
</body>
</html>
